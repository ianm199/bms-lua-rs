[package]
name = "bms-lua-rs-demo"
version = "0.1.0"
edition = "2021"
description = "Gate 1c: a bms app whose Lua scripting runs on the pure-Rust lua-rs backend (headless native proof)."

[dependencies]
bevy = { version = "0.18", default-features = false, features = ["bevy_asset"] }
bevy_mod_scripting_core = "0.19"
bevy_mod_scripting_functions = { version = "0.19", features = ["core_functions"] }
bevy_mod_scripting_asset = "0.19"
bevy_mod_scripting_script = "0.19"
bevy_mod_scripting_lua_rs = { path = "../bevy_mod_scripting_lua_rs" }

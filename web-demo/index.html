<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game of Life in Lua — bevy_mod_scripting on pure-Rust lua-rs, in the browser, no C</title>
  <link data-trunk rel="rust" />
  <link data-trunk rel="copy-dir" href="assets" />
  <link rel="stylesheet" href="assets/cm/codemirror.min.css" />
  <link rel="stylesheet" href="assets/cm/material-darker.min.css" />
  <script src="assets/cm/codemirror.min.js"></script>
  <script src="assets/cm/lua.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0b0b12; color: #e6e6ef;
      font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
    #app { display: flex; height: 100%; }
    #left { width: 520px; min-width: 380px; display: flex; flex-direction: column;
      border-right: 1px solid #23232f; padding: 14px 14px 10px; box-sizing: border-box; }
    #left h1 { font-size: 15px; margin: 0 0 2px; }
    #left p.sub { margin: 0 0 10px; color: #9aa; font-size: 12px; }
    #editorwrap { flex: 1; min-height: 0; overflow: hidden;
      border: 1px solid #23232f; border-radius: 6px; }
    #editor { width: 100%; height: 100%; box-sizing: border-box; resize: none; border: 0;
      background: #07070d; color: #d6e6d6; padding: 10px;
      font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
    .CodeMirror { height: 100% !important; font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
    #bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 0 4px; }
    button { background: #1c1c28; color: #e6e6ef; border: 1px solid #33334a; border-radius: 6px;
      padding: 7px 12px; cursor: pointer; font-size: 13px; }
    button:hover { background: #26263a; }
    button.run { background: #1f7a3f; border-color: #2da35a; font-weight: 600; }
    button.run:hover { background: #248c49; }
    #status { color: #8a8; font-size: 12px; margin-left: auto; }
    #right { flex: 1; position: relative; min-width: 0; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="app">
    <div id="left">
      <h1>Conway's Game of Life — scripted in Lua</h1>
      <p class="sub">bevy_mod_scripting's own example script, unmodified, driving a Bevy game
        through <b>pure-Rust lua-rs</b> — in your browser, no C, no server.
        <b>Edit the Lua, hit Run</b>, and the running game hot-reloads.</p>
      <div id="editorwrap"><textarea id="editor" spellcheck="false"></textarea></div>
      <div id="bar">
        <button id="run" class="run">Run &#9654;</button>
        <button id="conway">Conway (B3/S23)</button>
        <button id="highlife">HighLife (B36/S23)</button>
        <span id="status"></span>
      </div>
    </div>
    <div id="right"><canvas id="bevy"></canvas></div>
  </div>

  <script>
    const ta = document.getElementById('editor');
    const statusEl = document.getElementById('status');
    const setStatus = (m) => { statusEl.textContent = m; };

    // Use CodeMirror for syntax highlighting if it loaded; otherwise fall back to the
    // plain textarea. Either way `editor.get()/set()` work and the buttons get wired.
    let editor;
    try {
      const cm = CodeMirror.fromTextArea(ta, {
        mode: 'lua', theme: 'material-darker', lineNumbers: true, tabSize: 2,
      });
      editor = { get: () => cm.getValue(), set: (v) => { cm.setValue(v); cm.refresh(); } };
    } catch (e) {
      editor = { get: () => ta.value, set: (v) => { ta.value = v; } };
    }

    let ORIGINAL = '';
    fetch('assets/game_of_life.lua')
      .then((r) => r.text())
      .then((t) => { ORIGINAL = t; editor.set(t); })
      .catch(() => setStatus('could not load game_of_life.lua'));

    function run(src) {
      const b = window.wasmBindings;
      if (b && typeof b.set_script === 'function') {
        b.set_script(src);
        setStatus('▶ reloaded');
      } else {
        setStatus('engine still loading — try again in a moment');
      }
    }

    document.getElementById('run').onclick = () => run(editor.get());
    document.getElementById('conway').onclick = () => { editor.set(ORIGINAL); run(ORIGINAL); };
    document.getElementById('highlife').onclick = () => {
      const s = ORIGINAL.replace(
        'prev_state[i] == 0 and neighbours == 3 then',
        'prev_state[i] == 0 and (neighbours == 3 or neighbours == 6) then'
      );
      editor.set(s);
      run(s);
    };
  </script>
</body>
</html>

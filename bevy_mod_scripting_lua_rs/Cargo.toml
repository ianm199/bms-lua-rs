[package]
name = "bevy_mod_scripting_lua_rs"
version = "0.1.0"
edition = "2021"
description = "A pure-Rust Lua (lua-rs) backend for bevy_mod_scripting — closes #166: Lua scripting that compiles to wasm32-unknown-unknown with no C toolchain."

[dependencies]
bevy_mod_scripting_core = "0.19"
bevy_mod_scripting_bindings = "0.19"
bevy_mod_scripting_asset = "0.19"
bevy_mod_scripting_script = "0.19"
bevy_app = "0.18"
bevy_ecs = "0.18"
bevy_log = "0.18"
bevy_platform = "0.18"

# lua-rs vendored from the v0.0.7 release (create_userdata/UserData API + MetaMethod::Pairs).
# Vendored (not git/crates.io) so the demo repo is self-contained and builds anywhere.
lua-rs-runtime = { path = "../vendor/lua-rs/crates/lua-rs-runtime" }
lua-vm = { path = "../vendor/lua-rs/crates/lua-vm" }
lua-types = { path = "../vendor/lua-rs/crates/lua-types" }

[package]
name = "bevy_mod_scripting_lua_rs"
version = "0.1.0"
edition = "2021"
description = "A pure-Rust Lua (lua-rs) backend for bevy_mod_scripting — closes #166: Lua scripting that compiles to wasm32-unknown-unknown with no C toolchain."

[dependencies]
bevy_mod_scripting_core = "0.19"
bevy_mod_scripting_bindings = "0.19"
bevy_mod_scripting_asset = "0.19"
bevy_mod_scripting_script = "0.19"
bevy_app = "0.18"
bevy_ecs = "0.18"
bevy_log = "0.18"
bevy_platform = "0.18"

lua-rs-runtime = "0.0.7"
lua-vm = "0.0.7"
lua-types = "0.0.7"
